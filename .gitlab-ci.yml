# search-proxy runs a single deploy stage with no checks in front of it. That
# gap is deliberately closed here: nothing reaches an environment without
# formatting, typing, tests and a secret scan passing first.
#
# Paid Gemini calls are marked `live` in pytest and excluded by default, so CI
# never spends money. Run them by hand before a release.

stages:
  - check
  - deploy

.python:
  image: python:3.10.12
  before_script:
    # --require-hashes, so a tampered or replaced artefact fails the job
    # rather than reaching a test run that then passes.
    - pip install --upgrade pip
    - pip install --require-hashes -r requirements.txt -r requirements-dev.txt

lint:
  extends: .python
  stage: check
  script:
    - ruff check src tests
    - ruff format --check src tests

typecheck:
  extends: .python
  stage: check
  script:
    - mypy src

test:
  extends: .python
  stage: check
  script:
    - pytest
    - python -m src.tools.neutrality_scan

secrets:
  stage: check
  image: python:3.10.12
  script:
    - pip install detect-secrets==1.5.0
    - detect-secrets scan --baseline .secrets.baseline

# The release gate for rule 161. Two questions: does anything we INSTALL
# carry a known advisory (pip-audit, both lockfiles), and did WE write a
# hole (bandit, src only).
#
# `make audit AUDIT_BIN=` because this job installs into the system python
# rather than a venv. The commands and the ignore list live in the Makefile,
# so this job and the GitHub one cannot drift apart - and neither can the
# thing a developer runs before pushing.
#
# Deliberately NOT allow_failure. A dependency with a published hole is a
# release that does not go out, which is the whole point of having the job.
audit:
  extends: .python
  stage: check
  script:
    - make audit AUDIT_BIN=

deploy-code:
  stage: deploy
  image: python:3.10.12
  environment:
    name: ${CI_COMMIT_REF_NAME}
  script:
    - chmod +x deploy.sh
    - bash deploy.sh ${CI_COMMIT_REF_NAME}
  only:
    - development
    - stage
    - main
