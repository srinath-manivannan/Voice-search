# Strict, because the alternative is a type checker that agrees with
# everything. `mypy src` passed before this file existed and proved very
# little: with the defaults, an untyped function is simply not checked, and
# the places this code meets an untyped library - the websocket, the HTTP
# client, the Worker loaded out of another repository - are exactly the
# places a wrong assumption survives to production.
#
# Turning it on cost eight fixes. Every one of them was a real `Any` leaking
# out of a function that claimed to return something specific.

[mypy]
python_version = 3.10
strict = True
# The error, the file and the line, and the rule name so a disable comment
# can name what it is disabling.
show_error_codes = True
pretty = True

# Third-party packages without stubs. Listed one by one rather than globally
# ignored, so a new untyped dependency has to be added here deliberately.
[mypy-websockets.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True
