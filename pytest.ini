[pytest]
testpaths = tests
markers =
    live: calls the real Gemini Live API and spends money - needs GEMINI_API_KEY
    audio: needs a real microphone and speaker - CI runners have neither
    e2e: browser tests against a live widget server - needs Playwright's Chromium and WebKit
addopts = -q --strict-markers -m "not live and not audio and not e2e"
asyncio_mode = auto
