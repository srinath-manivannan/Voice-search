# Generated by `make alerts` from src/observability/alerts.py.
# Do not edit: change the rule there and regenerate, so the
# threshold that fires is the one that was reviewed.
groups:
  - name: poorvika-voice
    rules:
      - alert: CallersAreBeingCutOff
        expr: increase(voice_calls_stopped_by_budget_total[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: A session ceiling ended a call mid-conversation. Either one ran away or the ceiling is set wrong; both need a person.
          runbook: docs/ROLLBACK.md
      - alert: CallsAreFailing
        expr: increase(voice_calls_failed_total[15m]) / clamp_min(increase(voice_calls_total[15m]), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than one call in twenty ended in an error. This is the same figure docs/ROLLBACK.md rolls back on.
          runbook: docs/ROLLBACK.md
      - alert: TheAgentIsSlow
        expr: histogram_quantile(0.95, sum(rate(voice_first_audio_ms_bucket[15m])) by (le)) > 2000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: p95 first audio over 2 s, the Phase 1 target. A caller hears this as a line that has gone dead.
          runbook: docs/ROLLBACK.md
      - alert: ACallIsRunningAway
        expr: histogram_quantile(0.95, sum(rate(voice_rupees_per_minute_bucket[15m])) by (le)) >= 8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: p95 cost at or over the Rs 8 session ceiling. Deliberately not the Rs 2.50 target: every call is over that today, and an alert that fires every time is one people turn off.
          runbook: docs/ROLLBACK.md
      - alert: UpstreamIsStruggling
        expr: increase(tool_failures_total[15m]) / clamp_min(increase(tool_calls_total[15m]), 1) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: More than one tool call in ten failed. The agent then says it could not check, which is honest and does not sell anything.
          runbook: docs/ROLLBACK.md
