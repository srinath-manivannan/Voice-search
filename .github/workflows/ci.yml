# Formatting, types, tests and the container build - the four things that
# must be true before anything is merged.
#
# GitLab CI runs the same four (.gitlab-ci.yml) because deployment happens
# there. This file is what reviews pull requests. Neither is allowed to be
# the only place a check exists: a check that runs in one pipeline and not
# the other is a check that passes on the branch nobody is watching.
#
# Paid Gemini calls are marked `live` in pytest and excluded by default, so
# CI never spends money. Run them by hand before a release.

name: CI

on:
  push:
    branches: [main, stage, development]
  pull_request:

# A second push to the same branch cancels the first. Nobody reads the result
# of a run that is already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Format
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest

      - name: Secrets
        run: detect-secrets scan --baseline .secrets.baseline

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      # Built, never pushed. This proves the Dockerfile still works on every
      # change; where the image GOES is a deployment decision and lives in
      # deploy.sh, behind GitLab's environment-scoped secrets.
      - name: Build the image
        run: docker build -t poorvika-voice:${{ github.sha }} .

      - name: It starts, and it answers its own health check
        run: |
          docker run -d --name probe -p 8080:8080 \
            -e GEMINI_API_KEY=not-a-real-key \
            poorvika-voice:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/healthz; then
              echo "healthy"; docker rm -f probe; exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"; docker logs probe; exit 1
