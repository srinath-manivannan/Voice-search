# Formatting, types, tests and the container build - the four things that
# must be true before anything is merged.
#
# GitLab CI runs the same four (.gitlab-ci.yml) because deployment happens
# there. This file is what reviews pull requests. Neither is allowed to be
# the only place a check exists: a check that runs in one pipeline and not
# the other is a check that passes on the branch nobody is watching.
#
# Paid Gemini calls are marked `live` in pytest and excluded by default, so
# CI never spends money. Run them by hand before a release.

name: CI

on:
  push:
    branches: [main, stage, development]
  pull_request:

# A second push to the same branch cancels the first. Nobody reads the result
# of a run that is already out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The minor, not the patch. ubuntu-latest moved to 26.04 and
          # 3.10.12 is not published for it - the job failed in one second
          # on the first push, before installing anything.
          #
          # The exact patch is still pinned where it matters: the Dockerfile
          # says python:3.10.12-slim, and the `image` job below builds that
          # and starts it. So the interpreter that SHIPS is tested exactly,
          # and this job tests the code on whatever 3.10.x is current, which
          # is the thing it is actually for.
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install
        # --require-hashes, so a tampered or replaced artefact fails the
        # job rather than reaching a test run that then passes.
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Format
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Types
        run: mypy src

      - name: Tests
        run: pytest

      - name: Secrets
        run: detect-secrets scan --baseline .secrets.baseline

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      # Built, never pushed. This proves the Dockerfile still works on every
      # change; where the image GOES is a deployment decision and lives in
      # deploy.sh, behind GitLab's environment-scoped secrets.
      - name: Build the image
        run: |
          docker build \
            --build-arg APP_RELEASE=${GITHUB_SHA::8} \
            -t poorvika-voice:${{ github.sha }} .

      - name: It starts, answers its health check, and knows what it is
        run: |
          docker run -d --name probe -p 8080:8080 \
            -e GEMINI_API_KEY=not-a-real-key \
            poorvika-voice:${{ github.sha }}
          for _ in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8080/healthz > health.json; then
              cat health.json
              # A release the image cannot report is a rollback nobody can
              # verify. Checked here so it cannot rot unnoticed.
              grep -q "${GITHUB_SHA::8}" health.json || {
                echo "image does not report its own release"; exit 1; }
              docker rm -f probe; exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"; docker logs probe; exit 1
