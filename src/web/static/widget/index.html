<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopping Assistant</title>
  <link rel="stylesheet" href="/widget/v1/widget.css">
</head>
<body>
  <div class="sa-handle" id="sa-handle" aria-hidden="true"></div>
  <header class="sa-header">
    <svg class="sa-mark" viewBox="0 0 32 32" aria-hidden="true">
      <path fill="#fff" d="M7 6h14a5 5 0 0 1 5 5v7a5 5 0 0 1-5 5h-5.2l-3.2 3.4a1 1 0 0 1-1.7-.7V23H7a5 5 0 0 1-5-5v-7a5 5 0 0 1 5-5z"/>
      <circle cx="12" cy="14.5" r="1.3" fill="#0F5257"/>
    </svg>
    <div class="sa-titles">
      <h1 id="sa-title">Shopping Assistant</h1>
      <p>AI help for this store</p>
    </div>
    <button type="button" id="sa-min" aria-label="Minimise chat">–</button>
    <button type="button" id="sa-close" aria-label="Close chat">×</button>
  </header>
  <div class="sa-context">
    <p id="sa-context">Asking about: this page</p>
    <button type="button" id="sa-back" aria-label="Back to product page">‹ Back to product</button>
  </div>
  <div id="sa-log" class="sa-log" role="log" aria-live="polite" aria-relevant="additions">
    <p class="sa-msg assistant" id="sa-welcome">Hi! I'm the Shopping Assistant. Ask me about any product — prices, stock near you, offers or EMI. You can type in English, Tamil or Tanglish.</p>
  </div>
  <div id="sa-status" class="sa-status" role="status"></div>
  <div id="sa-alert" class="sa-alert" role="alert"></div>
  <div id="sa-chips" class="sa-chips"></div>
  <div id="sa-cards" class="sa-cards" role="list"></div>
  <form id="sa-form" class="sa-composer">
    <label class="sa-sr" for="sa-input">Message the Shopping Assistant</label>
    <textarea id="sa-input" rows="1" placeholder="Type your question…" autocomplete="off"></textarea>
    <button type="submit" class="sa-send" aria-label="Send message">➤</button>
  </form>
  <p class="sa-foot">AI answers · prices and stock checked live · confirm at checkout</p>
  <script id="sa-config" type="application/json">__SA_CONFIG_JSON__</script>
  <script src="/widget/v1/widget.js"></script>
</body>
</html>
